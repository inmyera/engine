<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Entry Browser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #browser {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      display: block;

      background: #fff;
    }

    #status {
      position: fixed;
      inset: 0;

      z-index: 999999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: #000;
      color: #fff;

      text-align: center;
    }

    #status.hidden {
      display: none;
    }

    #spinner {
      width: 38px;
      height: 38px;

      margin-bottom: 20px;

      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #fff;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    #title {
      margin-bottom: 8px;

      font-size: 20px;
      font-weight: 600;
    }

    #message {
      max-width: 650px;

      font-size: 14px;
      line-height: 1.5;

      opacity: 0.7;

      word-break: break-word;
    }

    #error {
      display: none;

      width: min(700px, 90vw);

      max-height: 300px;

      overflow: auto;

      margin-top: 20px;

      padding: 15px;

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;

      background: #111;

      color: #fff;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size: 12px;
      line-height: 1.5;

      text-align: left;

      white-space: pre-wrap;
      word-break: break-word;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>


<body>

  <iframe
    id="browser"
    allow="autoplay; fullscreen; clipboard-write; encrypted-media; geolocation"
    referrerpolicy="no-referrer"
  ></iframe>


  <div id="status">

    <div id="spinner"></div>

    <div id="title">
      Starting Entry
    </div>

    <div id="message">
      Initializing browser engine…
    </div>

    <div id="error"></div>

  </div>


  <!-- =====================================================
       ENGINE FILES
       ===================================================== -->

  <script src="/transport/index.js"></script>

  <script src="/corridor/corridor.js"></script>

  <script src="/controller/controller.api.js"></script>


  <script>

    (() => {

      "use strict";


      /* =====================================================
         CONFIGURATION
         ===================================================== */

      const CONFIG = {

        WISP:
          "wss://baylib.top/wisp/",

        SERVICE_WORKER:
          "/controller/controller.sw.js",

        SERVICE_WORKER_SCOPE:
          "/"

      };


      /* =====================================================
         ELEMENTS
         ===================================================== */

      const iframe =
        document.getElementById(
          "browser"
        );


      const status =
        document.getElementById(
          "status"
        );


      const spinner =
        document.getElementById(
          "spinner"
        );


      const title =
        document.getElementById(
          "title"
        );


      const message =
        document.getElementById(
          "message"
        );


      const errorBox =
        document.getElementById(
          "error"
        );


      /* =====================================================
         STATUS HELPERS
         ===================================================== */

      function setStatus(
        newTitle,
        newMessage
      ) {

        title.textContent =
          newTitle;


        message.textContent =
          newMessage || "";

      }


      function hideStatus() {

        status.classList.add(
          "hidden"
        );

      }


      function fail(error) {

        console.error(
          "[Entry Browser]",
          error
        );


        spinner.style.display =
          "none";


        title.textContent =
          "Entry failed to start";


        message.textContent =
          error?.message ||
          String(error);


        errorBox.style.display =
          "block";


        errorBox.textContent =
          error?.stack ||
          String(error);

      }


      /* =====================================================
         TIMEOUT
         ===================================================== */

      function withTimeout(
        promise,
        milliseconds,
        description
      ) {

        return Promise.race([

          Promise.resolve(
            promise
          ),

          new Promise(
            (_, reject) => {

              setTimeout(
                () => {

                  reject(
                    new Error(
                      description +
                      " timed out after " +
                      milliseconds +
                      "ms."
                    )
                  );

                },
                milliseconds
              );

            }
          )

        ]);

      }


      /* =====================================================
         TARGET URL
         ===================================================== */

      function getTarget() {

        const params =
          new URLSearchParams(
            window.location.search
          );


        let target =
          params.get(
            "url"
          );


        if (!target) {

          throw new Error(
            "No destination URL was supplied."
          );

        }


        target =
          target.trim();


        if (
          !/^https?:\/\//i.test(
            target
          )
        ) {

          target =
            "https://" +
            target;

        }


        let parsed;


        try {

          parsed =
            new URL(
              target
            );

        }

        catch {

          throw new Error(
            "Invalid destination URL."
          );

        }


        if (
          parsed.protocol !== "http:" &&
          parsed.protocol !== "https:"
        ) {

          throw new Error(
            "Only HTTP and HTTPS destinations are supported."
          );

        }


        return parsed.href;

      }


      /* =====================================================
         ENGINE CHECK
         ===================================================== */

      function checkEngine() {

        setStatus(
          "Checking engine",
          "Checking Epoxy and Corridor…"
        );


        /*
         * Epoxy browser bundle:
         *
         * window.EpoxyTransport
         * window.EpoxyTransport.EpoxyClient
         */

        if (
          !window.EpoxyTransport
        ) {

          throw new Error(
            "EpoxyTransport was not created by /transport/index.js"
          );

        }


        if (
          typeof window
            .EpoxyTransport
            .EpoxyClient !==
          "function"
        ) {

          const keys =
            Object.keys(
              window.EpoxyTransport
            );


          throw new Error(
            "EpoxyClient was not found. " +
            "Available EpoxyTransport exports: " +
            keys.join(", ")
          );

        }


        /*
         * Corridor WASM/browser runtime.
         */

        if (
          !window.$corridor
        ) {

          throw new Error(
            "Corridor was not created by /corridor/corridor.js"
          );

        }


        /*
         * Corridor controller API.
         */

        if (
          !window.$corridorController
        ) {

          throw new Error(
            "$corridorController was not created by /controller/controller.api.js"
          );

        }


        if (
          typeof window
            .$corridorController
            .Controller !==
          "function"
        ) {

          const keys =
            Object.keys(
              window.$corridorController
            );


          throw new Error(
            "Corridor Controller constructor was not found. " +
            "Available controller exports: " +
            keys.join(", ")
          );

        }

      }


      /* =====================================================
         SERVICE WORKER
         ===================================================== */

      async function registerServiceWorker() {

        setStatus(
          "Starting controller",
          "Registering browser service worker…"
        );


        if (
          !(
            "serviceWorker"
            in navigator
          )
        ) {

          throw new Error(
            "Service workers are not supported by this browser."
          );

        }


        const registration =
          await withTimeout(

            navigator
              .serviceWorker
              .register(
                CONFIG.SERVICE_WORKER,
                {
                  scope:
                    CONFIG.SERVICE_WORKER_SCOPE
                }
              ),

            15000,

            "Service worker registration"

          );


        setStatus(
          "Starting controller",
          "Waiting for service worker activation…"
        );


        await withTimeout(

          navigator
            .serviceWorker
            .ready,

          15000,

          "Service worker activation"

        );


        /*
         * The worker may have installed successfully
         * without controlling the current browse page
         * yet.
         */

        if (
          !navigator
            .serviceWorker
            .controller
        ) {

          setStatus(
            "Activating controller",
            "Finishing first-time browser setup…"
          );


          const alreadyReloaded =
            sessionStorage.getItem(
              "entry-service-worker-reload"
            );


          if (
            !alreadyReloaded
          ) {

            sessionStorage.setItem(
              "entry-service-worker-reload",
              "yes"
            );


            window.location.reload();


            await new Promise(
              () => {}
            );

          }


          throw new Error(
            "Service worker installed but did not take control of this page."
          );

        }


        sessionStorage.removeItem(
          "entry-service-worker-reload"
        );


        return {
          registration,

          worker:
            navigator
              .serviceWorker
              .controller
        };

      }


      /* =====================================================
         EPOXY TRANSPORT
         ===================================================== */

      async function createTransport() {

        setStatus(
          "Connecting",
          "Connecting to browser transport…"
        );


        const EpoxyClient =
          window
            .EpoxyTransport
            .EpoxyClient;


        /*
         * Correct browser-build constructor.
         */

        const transport =
          new EpoxyClient({

            wisp:
              CONFIG.WISP

          });


        /*
         * Different Epoxy versions initialize
         * slightly differently.
         *
         * If init() exists, initialize it here.
         */

        if (
          typeof transport.init ===
          "function"
        ) {

          setStatus(
            "Connecting",
            "Initializing Epoxy transport…"
          );


          await withTimeout(

            transport.init(),

            20000,

            "Epoxy initialization"

          );

        }


        return transport;

      }


      /* =====================================================
         CORRIDOR CONTROLLER
         ===================================================== */

      async function createController(
        worker,
        transport
      ) {

        setStatus(
          "Starting browser",
          "Initializing Corridor controller…"
        );


        const Controller =
          window
            .$corridorController
            .Controller;


        const controller =
          new Controller({

            serviceworker:
              worker,

            transport:
              transport

          });


        if (
          typeof controller.wait ===
          "function"
        ) {

          await withTimeout(

            controller.wait(),

            20000,

            "Corridor controller"

          );

        }


        return controller;

      }


      /* =====================================================
         CREATE FRAME
         ===================================================== */

      function createBrowserFrame(
        controller
      ) {

        if (
          typeof controller.createFrame !==
          "function"
        ) {

          throw new Error(
            "Corridor Controller does not provide createFrame()."
          );

        }


        const frame =
          controller.createFrame(
            iframe
          );


        if (!frame) {

          throw new Error(
            "Corridor failed to create the browser frame."
          );

        }


        if (
          typeof frame.go !==
          "function"
        ) {

          throw new Error(
            "Corridor frame does not provide go()."
          );

        }


        return frame;

      }


      /* =====================================================
         OPEN DESTINATION
         ===================================================== */

      async function openDestination(
        controller,
        target
      ) {

        setStatus(
          "Opening website",
          target
        );


        const frame =
          createBrowserFrame(
            controller
          );


        let finished =
          false;


        function finish() {

          if (finished) {
            return;
          }


          finished =
            true;


          hideStatus();

        }


        iframe.addEventListener(
          "load",
          finish,
          {
            once: true
          }
        );


        /*
         * Corridor's frame.go() may be synchronous
         * depending on the controller build.
         */

        const result =
          frame.go(
            target
          );


        /*
         * If this build happens to return a Promise,
         * wait for it.
         */

        if (
          result &&
          typeof result.then ===
            "function"
        ) {

          await withTimeout(

            result,

            20000,

            "Website navigation"

          );

        }


        /*
         * Safety fallback:
         *
         * Once Corridor has navigated the iframe,
         * don't leave the loading screen permanently
         * covering a slow destination.
         */

        setTimeout(
          finish,
          10000
        );

      }


      /* =====================================================
         MAIN STARTUP
         ===================================================== */

      async function start() {

        try {

          setStatus(
            "Starting Entry",
            "Reading destination…"
          );


          /*
           * Destination.
           */

          const target =
            getTarget();


          /*
           * Verify all browser bundles.
           */

          checkEngine();


          /*
           * Service worker.
           */

          const {
            worker
          } =
            await registerServiceWorker();


          /*
           * Epoxy + Wisp.
           */

          const transport =
            await createTransport();


          /*
           * Corridor.
           */

          const controller =
            await createController(
              worker,
              transport
            );


          /*
           * Navigate.
           */

          await openDestination(
            controller,
            target
          );

        }

        catch (error) {

          fail(
            error
          );

        }

      }


      /* =====================================================
         GLOBAL ERROR REPORTING
         ===================================================== */

      window.addEventListener(
        "error",
        event => {

          console.error(
            "[Entry global error]",
            event.error ||
            event.message
          );

        }
      );


      window.addEventListener(
        "unhandledrejection",
        event => {

          console.error(
            "[Entry unhandled rejection]",
            event.reason
          );

        }
      );


      /* =====================================================
         START ENTRY
         ===================================================== */

      start();

    })();

  </script>

</body>

</html>
