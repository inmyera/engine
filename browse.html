<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Entry Browser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #browser {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    #status {
      position: fixed;
      inset: 0;
      z-index: 999999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: #000;
      color: #fff;

      text-align: center;
    }

    #status.hidden {
      display: none;
    }

    #spinner {
      width: 38px;
      height: 38px;

      margin-bottom: 20px;

      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #fff;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    #title {
      margin-bottom: 8px;

      font-size: 20px;
      font-weight: 600;
    }

    #message {
      max-width: 650px;

      font-size: 14px;
      line-height: 1.5;

      opacity: 0.7;

      word-break: break-word;
    }

    #error {
      display: none;

      max-width: 700px;

      margin-top: 20px;

      padding: 15px;

      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;

      background: #111;

      font-family: monospace;

      font-size: 12px;

      text-align: left;

      white-space: pre-wrap;
      word-break: break-word;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>


<body>

  <iframe
    id="browser"
    allow="autoplay; fullscreen; clipboard-write; encrypted-media; geolocation"
    referrerpolicy="no-referrer"
  ></iframe>


  <div id="status">

    <div id="spinner"></div>

    <div id="title">
      Starting Entry
    </div>

    <div id="message">
      Initializing browser engine…
    </div>

    <div id="error"></div>

  </div>


  <!--
    IMPORTANT:

    These are normal browser bundles.

    transport/index.js creates:
      window.EpoxyTransport

    corridor.js creates:
      window.$corridor

    controller.api.js creates:
      window.$corridorController
  -->

  <script src="/transport/index.js"></script>

  <script src="/corridor/corridor.js"></script>

  <script src="/controller/controller.api.js"></script>


  <script>

    (() => {

      "use strict";


      /* =====================================================
         CONFIG
         ===================================================== */

      const CONFIG = {

        WISP:
          "wss://baylib.top/wisp/",

        SERVICE_WORKER:
          "/controller/controller.sw.js"

      };


      /* =====================================================
         ELEMENTS
         ===================================================== */

      const iframe =
        document.getElementById(
          "browser"
        );


      const status =
        document.getElementById(
          "status"
        );


      const spinner =
        document.getElementById(
          "spinner"
        );


      const title =
        document.getElementById(
          "title"
        );


      const message =
        document.getElementById(
          "message"
        );


      const errorBox =
        document.getElementById(
          "error"
        );


      /* =====================================================
         STATUS
         ===================================================== */

      function setStatus(
        newTitle,
        newMessage
      ) {

        title.textContent =
          newTitle;


        message.textContent =
          newMessage || "";

      }


      function hideStatus() {

        status.classList.add(
          "hidden"
        );

      }


      function fail(error) {

        console.error(
          "[Entry Browser]",
          error
        );


        spinner.style.display =
          "none";


        title.textContent =
          "Entry failed to start";


        message.textContent =
          error?.message ||
          String(error);


        errorBox.style.display =
          "block";


        errorBox.textContent =
          error?.stack ||
          String(error);

      }


      /* =====================================================
         TIMEOUT HELPER
         ===================================================== */

      function timeout(
        promise,
        milliseconds,
        description
      ) {

        return Promise.race([

          promise,

          new Promise(
            (_, reject) => {

              setTimeout(
                () => {

                  reject(
                    new Error(
                      description +
                      " timed out."
                    )
                  );

                },
                milliseconds
              );

            }
          )

        ]);

      }


      /* =====================================================
         DESTINATION
         ===================================================== */

      function getTarget() {

        const params =
          new URLSearchParams(
            window.location.search
          );


        let target =
          params.get(
            "url"
          );


        if (!target) {

          throw new Error(
            "No destination URL was supplied."
          );

        }


        target =
          target.trim();


        if (
          !/^https?:\/\//i.test(
            target
          )
        ) {

          target =
            "https://" +
            target;

        }


        let parsed;


        try {

          parsed =
            new URL(
              target
            );

        }

        catch {

          throw new Error(
            "The destination URL is invalid."
          );

        }


        if (
          parsed.protocol !==
            "http:" &&

          parsed.protocol !==
            "https:"
        ) {

          throw new Error(
            "Only HTTP and HTTPS URLs are supported."
          );

        }


        return parsed.href;

      }


      /* =====================================================
         CHECK ENGINE FILES
         ===================================================== */

      function checkEngine() {

        setStatus(
          "Checking engine",
          "Checking Corridor and Epoxy…"
        );


        if (
          typeof window.EpoxyTransport !==
          "function"
        ) {

          throw new Error(
            "EpoxyTransport did not load from /transport/index.js"
          );

        }


        if (
          !window.$corridor
        ) {

          throw new Error(
            "Corridor did not load from /corridor/corridor.js"
          );

        }


        if (
          !window.$corridorController ||
          typeof window
            .$corridorController
            .Controller !==
            "function"
        ) {

          throw new Error(
            "Corridor Controller did not load from /controller/controller.api.js"
          );

        }

      }


      /* =====================================================
         SERVICE WORKER
         ===================================================== */

      async function startServiceWorker() {

        setStatus(
          "Starting controller",
          "Registering browser service worker…"
        );


        if (
          !(
            "serviceWorker"
            in navigator
          )
        ) {

          throw new Error(
            "This browser does not support service workers."
          );

        }


        const registration =
          await timeout(

            navigator
              .serviceWorker
              .register(
                CONFIG.SERVICE_WORKER,
                {
                  scope: "/"
                }
              ),

            15000,

            "Service worker registration"

          );


        setStatus(
          "Starting controller",
          "Waiting for service worker…"
        );


        await timeout(

          navigator
            .serviceWorker
            .ready,

          15000,

          "Service worker activation"

        );


        /*
         * Corridor expects the service worker
         * currently controlling this page.
         *
         * On the first load, registration can
         * succeed before the page is controlled.
         */

        if (
          !navigator
            .serviceWorker
            .controller
        ) {

          setStatus(
            "Activating controller",
            "Finishing first-time setup…"
          );


          /*
           * Give the newly installed worker a
           * chance to take control.
           */

          await new Promise(
            resolve => {

              let finished =
                false;


              const finish =
                () => {

                  if (finished) {
                    return;
                  }


                  finished =
                    true;


                  resolve();

                };


              navigator
                .serviceWorker
                .addEventListener(
                  "controllerchange",
                  finish,
                  {
                    once: true
                  }
                );


              setTimeout(
                finish,
                3000
              );

            }
          );

        }


        /*
         * If this is the very first visit and
         * the page still isn't controlled,
         * reload once.
         */

        if (
          !navigator
            .serviceWorker
            .controller
        ) {

          const alreadyReloaded =
            sessionStorage.getItem(
              "entry-sw-reload"
            );


          if (
            !alreadyReloaded
          ) {

            sessionStorage.setItem(
              "entry-sw-reload",
              "1"
            );


            location.reload();


            await new Promise(
              () => {}
            );

          }


          throw new Error(
            "Service worker installed but did not take control of the page."
          );

        }


        sessionStorage.removeItem(
          "entry-sw-reload"
        );


        return (
          navigator
            .serviceWorker
            .controller
        );

      }


      /* =====================================================
         EPOXY TRANSPORT
         ===================================================== */

      async function startTransport() {

        setStatus(
          "Connecting",
          "Starting private network transport…"
        );


        const transport =
          new window.EpoxyTransport({
            wisp:
              CONFIG.WISP
          });


        /*
         * The actual Epoxy build in your engine
         * has init() and sets transport.ready.
         */

        await timeout(

          transport.init(),

          20000,

          "Epoxy transport"

        );


        if (
          !transport.ready
        ) {

          throw new Error(
            "Epoxy initialized but did not become ready."
          );

        }


        return transport;

      }


      /* =====================================================
         CORRIDOR CONTROLLER
         ===================================================== */

      async function startController(
        serviceWorker,
        transport
      ) {

        setStatus(
          "Starting browser",
          "Initializing Corridor controller…"
        );


        const Controller =
          window
            .$corridorController
            .Controller;


        const controller =
          new Controller({

            serviceworker:
              serviceWorker,

            transport:
              transport

          });


        await timeout(

          controller.wait(),

          20000,

          "Corridor controller"

        );


        return controller;

      }


      /* =====================================================
         OPEN WEBSITE
         ===================================================== */

      function openWebsite(
        controller,
        target
      ) {

        setStatus(
          "Opening website",
          target
        );


        const frame =
          controller.createFrame(
            iframe
          );


        if (
          !frame ||
          typeof frame.go !==
            "function"
        ) {

          throw new Error(
            "Corridor did not create a valid browser frame."
          );

        }


        /*
         * frame.go() is synchronous in the
         * controller included in your ZIP.
         *
         * It rewrites the URL into the
         * /~/sj/... service-worker route.
         */

        frame.go(
          target
        );


        /*
         * Hide loader once iframe starts loading.
         */

        let hidden =
          false;


        const finish =
          () => {

            if (hidden) {
              return;
            }


            hidden =
              true;


            hideStatus();

        };


        iframe.addEventListener(
          "load",
          finish,
          {
            once: true
          }
        );


        /*
         * Don't leave the Entry loader covering
         * the page indefinitely if the remote site
         * takes a long time to fire iframe load.
         */

        setTimeout(
          finish,
          8000
        );

      }


      /* =====================================================
         START
         ===================================================== */

      async function start() {

        try {

          setStatus(
            "Starting Entry",
            "Reading destination…"
          );


          const target =
            getTarget();


          /*
           * Verify the three bundles actually
           * loaded before doing anything else.
           */

          checkEngine();


          /*
           * Service worker
           */

          const serviceWorker =
            await startServiceWorker();


          /*
           * Epoxy / Wisp
           */

          const transport =
            await startTransport();


          /*
           * Corridor
           */

          const controller =
            await startController(
              serviceWorker,
              transport
            );


          /*
           * Destination
           */

          openWebsite(
            controller,
            target
          );

        }

        catch (error) {

          fail(
            error
          );

        }

      }


      /* =====================================================
         GLOBAL ERROR REPORTING
         ===================================================== */

      window.addEventListener(
        "error",
        event => {

          console.error(
            "[Entry window error]",
            event.error ||
            event.message
          );

        }
      );


      window.addEventListener(
        "unhandledrejection",
        event => {

          console.error(
            "[Entry promise rejection]",
            event.reason
          );

        }
      );


      /* =====================================================
         GO
         ===================================================== */

      start();

    })();

  </script>

</body>

</html>
